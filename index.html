<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Archive" />
  <title>Archive</title>
  <style>
    :root{
      --bg:#f5f3ee;--card:rgba(255,255,255,.78);--text:#181818;--muted:#77726c;
      --line:rgba(24,24,24,.10);--accent:#272727;--shadow:0 8px 28px rgba(24,24,24,.07);

      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color-scheme:light;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--text)} body{min-height:100dvh}
    button,input,textarea,select{font:inherit} button{-webkit-tap-highlight-color:transparent} button{cursor:pointer}
    input,textarea,select{width:100%;min-width:0;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--text);border-radius:16px;padding:13px 14px;outline:none}
    input:focus,textarea:focus,select:focus{border-color:rgba(24,24,24,.32);box-shadow:0 0 0 3px rgba(24,24,24,.05)}
    input[type="date"],input[type="datetime-local"]{display:block;width:100%;max-width:100%;min-width:0}
    textarea{min-height:210px;resize:vertical;line-height:1.55}
    .app{min-height:100dvh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
    .topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:84px minmax(0,1fr) 84px;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(to bottom,rgba(245,243,238,.98),rgba(245,243,238,.88),rgba(245,243,238,0));backdrop-filter:blur(18px)}
    .brand{font-size:18px;font-weight:750;letter-spacing:-.02em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .top-back{width:38px;height:38px;border:0;background:transparent;color:var(--text);font-size:23px;padding:0}.top-back.hidden{visibility:hidden;pointer-events:none}
    .top-actions{display:flex;gap:8px;justify-content:flex-end;justify-self:end}.icon-btn{width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.78);box-shadow:0 3px 16px rgba(0,0,0,.05);color:var(--text);font-size:18px}.is-hidden{display:none!important}
    main{width:min(720px,100%);margin:0 auto;padding:4px 16px 32px}.view{display:none}.view.active{display:block}.view-pad{height:6px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:12px;backdrop-filter:blur(12px)}
    .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px;color:var(--muted);font-size:12px}.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:rgba(24,24,24,.06);color:#4d4944;font-size:11px;font-weight:700}
    .card-text{white-space:pre-wrap;font-size:17px;line-height:1.62;letter-spacing:-.01em;overflow-wrap:anywhere}.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.tag{color:#65605a;font-size:12px}
    .ghost-btn,.primary-btn{border:0}.ghost-btn{background:rgba(24,24,24,.06);color:var(--text);padding:9px 12px;border-radius:12px;font-size:13px}.primary-btn{background:var(--accent);color:white;padding:12px 16px;border-radius:14px;font-weight:750}.wide{width:100%}
    .feed-card{position:relative;padding:20px}.feed-copy{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;border-radius:10px;background:rgba(255,255,255,.72);color:var(--muted);font-size:14px;display:grid;place-items:center}.feed-card .card-meta{padding-right:34px}.feed-text.collapsed{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;overflow:hidden}
    .card-expand-row{width:100%;min-height:44px;margin:14px 0 0;padding:10px 11px;border:1px solid rgba(24,24,24,.07);border-radius:13px;background:rgba(24,24,24,.035);color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:750;text-align:left}.card-expand-row .expand-side{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px}.expand-chevron{font-size:16px;transition:transform .15s}.card-expand-row[aria-expanded="true"] .expand-chevron{transform:rotate(180deg)}
    .archive-card{cursor:pointer;position:relative}.archive-card .card-meta{padding-right:70px}.archive-text.collapsed{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:12;overflow:hidden}.archive-char-count.hidden{display:none}.card-top-actions{position:absolute;top:12px;right:12px;display:flex;gap:5px;z-index:2}.card-top-action{width:30px;height:30px;border:0;border-radius:10px;background:rgba(255,255,255,.76);color:var(--muted);display:grid;place-items:center;font-size:14px}
    .microblog-card{position:relative}.microblog-thread-content{display:grid;gap:14px;padding-right:34px}.microblog-thread-content.collapsed{max-height:430px;overflow:hidden}.microblog-post+.microblog-post{padding-top:13px;border-top:1px solid var(--line)}.microblog-post-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.62}.microblog-post-date{margin-top:7px;color:var(--muted);font-size:12px}.micro-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}.microblog-context{margin:6px 0 12px;padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.52)}.microblog-context-label{color:var(--muted);font-size:12px;font-weight:750;margin-bottom:10px}.microblog-compose textarea{min-height:240px;font-size:17px;line-height:1.65}
    .field{margin-bottom:14px;min-width:0}label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 7px 2px}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.empty{padding:34px 20px;color:var(--muted);text-align:center;border:1px dashed rgba(24,24,24,.14);border-radius:20px;line-height:1.55}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 2px 10px}.section-head h2{margin:0;font-size:17px}.section-head button{background:transparent;color:var(--muted);border:0;font-size:13px}
    .archive-controls{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:10;margin:0 -16px 10px;padding:8px 16px 10px;background:rgba(248,247,243,.96);backdrop-filter:blur(18px);border-bottom:1px solid rgba(24,24,24,.055)}
    .archive-search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.archive-filter-toggle{align-self:stretch;border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--muted);border-radius:14px;padding:0 13px;font-size:13px;font-weight:750}.archive-filter-toggle[aria-expanded="true"]{color:var(--text);background:rgba(24,24,24,.07)}.archive-filter-panel{display:none;padding-top:9px}.archive-filter-panel.open{display:block}.filter-card{padding:14px;margin-bottom:0;box-shadow:none;background:rgba(255,255,255,.72)}.filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.filter-grid>*{min-width:0}.filter-grid .field{margin:0}.filter-grid .field.full{grid-column:1/-1}.filter-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.filter-row>*{min-width:0}
    .statline{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px}.statline strong{color:var(--text)}
    .hub-list{display:grid;gap:10px}.hub-btn{width:100%;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:17px 16px;text-align:left;color:var(--text);box-shadow:var(--shadow)}.hub-btn strong{display:block;font-size:17px;margin-bottom:5px}.hub-btn span{color:var(--muted);font-size:13px;line-height:1.5}
    .pool-item{display:flex;align-items:flex-start;gap:12px}.pool-main{flex:1;min-width:0}.pool-title{font-size:16px;line-height:1.45}.pool-meta{color:var(--muted);font-size:12px;margin-top:7px;line-height:1.45}.pool-summary{color:#514d48;font-size:14px;margin-top:8px;line-height:1.5;white-space:pre-wrap}.pool-rel{color:var(--muted);font-size:11px;margin-top:7px;line-height:1.4}.done .pool-title{text-decoration:line-through;color:var(--muted)}.check{width:26px;height:26px;border-radius:50%;border:1px solid rgba(24,24,24,.18);background:rgba(255,255,255,.7);color:var(--text);display:grid;place-items:center;flex:0 0 auto}.done .check{background:var(--accent);color:white}
    .bottom-nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:0;width:min(720px,100%);height:calc(var(--nav-h) + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);align-items:start;padding:8px 10px env(safe-area-inset-bottom);background:rgba(248,247,243,.88);backdrop-filter:blur(22px);border-top:1px solid var(--line)}.nav-btn{border:0;background:transparent;color:#89847e;padding:6px 4px;border-radius:14px;font-size:12px;font-weight:650}.nav-btn b{display:block;font-size:24px;line-height:1.05;margin-bottom:3px;font-weight:500}.nav-btn.active{color:var(--text);background:rgba(24,24,24,.055)}
    .fab{position:fixed;z-index:31;right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));width:56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:white;font-size:28px;box-shadow:0 12px 30px rgba(24,24,24,.22)}
    .modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.24);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}.modal-backdrop.open{display:flex}.sheet{width:min(720px,100%);max-height:90dvh;overflow:auto;background:#f8f7f3;border-radius:28px 28px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 70px rgba(0,0,0,.12)}.handle{width:42px;height:5px;border-radius:999px;background:rgba(24,24,24,.15);margin:0 auto 14px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet-head h3{margin:0;font-size:18px}.sheet-head button{border:0;background:transparent;color:var(--muted);font-size:14px}.fullscreen-editor{align-items:stretch;background:var(--bg);backdrop-filter:none}.fullscreen-editor .sheet{width:min(720px,100%);height:100dvh;max-height:none;border-radius:0;box-shadow:none;padding:0 16px calc(20px + env(safe-area-inset-bottom));background:var(--bg)}.fullscreen-editor .handle{display:none}.fullscreen-editor .sheet-head{position:sticky;top:0;z-index:3;margin:0 -16px 14px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(248,247,243,.95);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}#recordModal #editText{min-height:48dvh;resize:none}.sheet-head-actions{display:flex;align-items:center;gap:4px}.sheet-head-actions button{padding:7px 8px}.danger{color:#9b2c2c!important}
    .toast{position:fixed;z-index:200;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));background:rgba(24,24,24,.94);color:white;border-radius:999px;padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.small{font-size:12px;color:var(--muted);line-height:1.5}.settings-grid{display:grid;gap:10px}.settings-grid button{font:inherit;text-align:left;width:100%;padding:14px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.8)}
    .note-floatbar{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:10;margin:0 -16px 10px;padding:8px 16px 9px;background:rgba(248,247,243,.96);backdrop-filter:blur(18px);border-bottom:1px solid rgba(24,24,24,.055)}.note-float-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.note-float-row select{background:rgba(255,255,255,.96)}.note-tools-toggle{border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--muted);border-radius:14px;padding:0 13px;font-size:13px;font-weight:750}.note-tools-toggle[aria-expanded="true"]{color:var(--text);background:rgba(24,24,24,.07)}.note-tools-panel{display:none;padding-top:8px}.note-tools-panel.open{display:grid;gap:8px}.note-tools-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.note-tools-row button{border:1px solid var(--line);background:rgba(255,255,255,.82);border-radius:14px;padding:0 13px;font-size:13px;font-weight:750}
    .note-item{cursor:pointer}.note-item:active{transform:scale(.995)}.note-preview{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;white-space:pre-wrap;font-size:16px;line-height:1.6;overflow-wrap:anywhere}.note-meta{color:var(--muted);font-size:12px;margin-top:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.note-category{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:rgba(24,24,24,.06);color:#5f5a54;font-size:11px;font-weight:700}.note-draft-card{border-style:dashed}
    .category-manager-list{display:grid;gap:8px;margin-bottom:14px}.category-manager-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.72)}.category-manager-main{min-width:0}.category-manager-main strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.category-manager-main small{color:var(--muted)}.category-order-actions{display:flex;gap:4px}.category-order-actions button{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.9);color:var(--text)}.category-order-actions button:disabled{opacity:.25}
    .note-editor{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.note-editor.open{display:block}.note-editor-head{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:rgba(245,243,238,.95);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.note-editor-head button{border:0;background:transparent;color:var(--text);padding:8px 6px}.note-editor-category{min-width:0;display:flex;align-items:center;gap:6px}.note-editor-category input{min-width:0;border:0;background:rgba(255,255,255,.58);border-radius:11px;padding:8px 9px;font-size:12px;box-shadow:none}.note-counter{font-size:10px;color:var(--muted);white-space:nowrap}.note-head-actions{display:flex;align-items:center;gap:2px}.note-head-actions button{font-size:14px}.note-editor-body{width:100%;min-height:100%;padding:0 0 max(34vh,180px)}#noteText{display:block;width:100%;min-height:calc(100dvh - 95px);border:0;background:transparent;border-radius:0;padding:14px 16px 0;resize:none;overflow:hidden;box-shadow:none;font-size:16px;line-height:1.65}#noteText:focus{border:0;box-shadow:none}
    .timeline-jump{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:9;margin:0 -16px 8px;padding:8px 16px 12px;background:linear-gradient(to bottom,var(--bg) 78%,transparent)}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.72);padding:9px 12px;border-radius:999px;color:var(--muted);font-size:13px}.timeline-controls{display:flex;align-items:center;justify-content:space-between;gap:10px}.timeline-lang{display:flex;gap:6px;flex:0 0 auto}.timeline-lang button{border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--muted);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.timeline-lang button.active{background:var(--accent);color:white;border-color:var(--accent)}.timeline-list{position:relative;padding-left:16px}.timeline-list:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:rgba(24,24,24,.13)}.timeline-block{position:relative;margin:0 0 14px 10px;padding:15px 15px 16px;scroll-margin-top:150px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}.timeline-block:before{content:"";position:absolute;left:-20px;top:21px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}.timeline-block.secondary-only{background:rgba(255,255,255,.42);box-shadow:none;border-color:rgba(24,24,24,.07)}.timeline-block.secondary-only:before{background:#aaa49d}.timeline-block.secondary-only .timeline-year{font-size:18px;color:#6c6761;font-weight:700}.timeline-block.secondary-only .timeline-event{font-size:15px;color:#59554f}.timeline-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}.timeline-year{font-size:21px;font-weight:800;letter-spacing:-.03em}.timeline-ages{color:var(--muted);font-size:13px;text-align:right;white-space:nowr <body>
<div class="app">
  <header class="topbar">
    <button class="top-back hidden" id="backTop" aria-label="뒤로가기">‹</button>
    <div class="brand" id="pageTitle">피드</div>
    <div class="top-actions"><button class="icon-btn" id="shuffleTop" aria-label="피드 섞기">↻</button><button class="icon-btn" id="settingsBtn" aria-label="설정">⋯</button></div>
  </header>

  <main>
    <section class="view active" id="view-feed"><div class="view-pad"></div><div id="feedList"></div></section>

    <section class="view" id="view-write"><div class="view-pad"></div><div id="microThreadContext"></div><div class="card microblog-compose"><div class="field"><textarea id="microText" placeholder="무슨 생각 중?"></textarea></div><button class="primary-btn wide" id="publishMicro">올리기</button></div></section>

    <section class="view" id="view-notes">
      <div class="note-floatbar">
        <div class="note-float-row"><select id="noteCategorySelect" aria-label="노트 카테고리"></select><button class="note-tools-toggle" id="noteToolsToggle" type="button" aria-expanded="false">도구</button></div>
        <div class="note-tools-panel" id="noteToolsPanel"><input id="noteSearchInput" placeholder="노트 검색" /><div class="note-tools-row"><select id="noteSort" aria-label="노트 정렬"><option value="updatedDesc">수정일 최신순</option><option value="updatedAsc">수정일 오래된순</option><option value="createdDesc">생성일 최신순</option><option value="createdAsc">생성일 오래된순</option></select><button id="manageNoteCategories" type="button">카테고리 편집</button></div></div>
      </div>
      <div id="noteList"></div>
    </section>

    <section class="view" id="view-pool"><div class="view-pad"></div><div class="card" id="poolPickCard"></div><div class="section-head"><h2>할 거리</h2><button id="addPoolBtn">+ 추가</button></div><div id="poolList"></div></section>

    <section class="view" id="view-more"><div class="view-pad"></div><div class="hub-list"><button class="hub-btn" data-open-view="timeline"><strong>연표</strong><span>연도별 기록 확인</span></button><button class="hub-btn" data-open-view="scripts"><strong>스크립트</strong><span>항목별 텍스트 열람</span></button><button class="hub-btn" data-open-view="links"><strong>링크</strong><span>외부 도구와 바로가기 · 준비 중</span></button><button class="hub-btn" data-open-view="archive"><strong>보관함</strong><span>감상 기록 검색 · 필터 · 관리</span></button><button class="hub-btn" data-open-view="library"><strong>자료실</strong><span>텍스트 자료 아카이브 · 준비 중</span></button></div></section>

    <section class="view" id="view-archive">

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY='archive-prototype-v2';
  const NOTE_DRAFT_KEY='archive-prototype-note-draft-v1';
  const MICRO_DRAFT_KEY='archive-prototype-microblog-draft-v1';
  const EVENT_KEY='archive-prototype-events-v2';
  const TIMELINE_LANG_KEY='archive-prototype-timeline-lang-v1';
  const NOTE_SORT_KEY='archive-prototype-note-sort-v1';
  const NOTE_CATEGORY_ORDER_KEY='archive-prototype-note-category-order-v1';
  const APP_VERSION='2026.09.02.1';
  const FEED_BATCH=20,ARCHIVE_BATCH=100,FEED_COLLAPSE_THRESHOLD=360,ARCHIVE_COLLAPSE_THRESHOLD=900,MICROBLOG_COLLAPSE_THRESHOLD=700,DAY=86400000;
  const now=Date.now();
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const starter={notes:[],scripts:[],timeline:[],microblogPosts:[],records:[
    {id:crypto.randomUUID(),content:'나중에 다시 읽으면 지금과 전혀 다르게 보일 수도 있는 장면. 일단 지금 느낀 걸 그대로 남겨두기.',tags:['장면'],priority:'',createdAt:new Date(now-3*DAY).toISOString()},
    {id:crypto.randomUUID(),content:'대사보다 먼저 이미지가 떠오르는 경우가 있다. 그럴 때는 설명하려고 하지 말고 장면 단위로 먼저 적어두자.',tags:['작업'],priority:'',createdAt:new Date(now-10*DAY).toISOString()}
  ],pool:[{id:crypto.randomUUID(),title:'예전에 저장한 기록 하나 다시 읽기',summary:'',assignee:'',dueDate:'',parents:[],status:'미완료',priority:'',children:[]}]};

  function normalizeDate(v){if(typeof v==='string'&&v.trim())return v.trim();if(typeof v==='number')return new Date(v).toISOString();return new Date().toISOString();}
  const deletedAtOf=v=>v?normalizeDate(v):'';
  function normalizeRecord(r={}){const out={id:String(r.id||crypto.randomUUID()),content:String(r.content||''),createdAt:normalizeDate(r.createdAt),tags:Array.isArray(r.tags)?[...new Set(r.tags.map(x=>String(x).trim()).filter(Boolean))]:[],priority:['A','B','C'].includes(r.priority)?r.priority:'',deletedAt:deletedAtOf(r.deletedAt)};if(r.sourceUid)out.sourceUid=String(r.sourceUid);if(r.sourceRow!=null)out.sourceRow=r.sourceRow;return out;}
  function normalizeNote(n={}){const createdAt=normalizeDate(n.createdAt);const out={id:String(n.id||crypto.randomUUID()),content:String(n.content||''),category:String(n.category||'').trim(),createdAt,updatedAt:normalizeDate(n.updatedAt||createdAt),tags:Array.isArray(n.tags)?[...new Set(n.tags.map(x=>String(x).trim()).filter(Boolean))]:[],deletedAt:deletedAtOf(n.deletedAt)};if(n.previousVersion&&typeof n.previousVersion==='object')out.previousVersion={content:String(n.previousVersion.content||''),category:String(n.previousVersion.category||'').trim(),updatedAt:normalizeDate(n.previousVersion.updatedAt||createdAt)};return out;}
  function normalizeRelationList(v){return Array.isArray(v)?v.map(x=>typeof x==='string'?{title:String(x),url:''}:{title:String(x?.title||''),url:String(x?.url||'')}).filter(x=>x.title):[];}
  function normalizePool(p={}){const out={id:String(p.id||crypto.randomUUID()),title:String(p.title||''),summary:String(p.summary||''),assignee:String(p.assignee||''),dueDate:String(p.dueDate||''),parents:normalizeRelationList(p.parents),status:['미완료','상시 작업','완료'].includes(p.status)?p.status:'미완료',priority:['High','Med','Low'].includes(p.priority)?p.priority:'',children:normalizeRelationList(p.children),deletedAt:deletedAtOf(p.deletedAt)};if(p.sourceRow!=null)out.sourceRow=p.sourceRow;return out;}
  function normalizeScriptItem(x={},i=0){return {id:String(x.id||`script-${i+1}`),title:String(x.title||'').trim(),order:Number.isFinite(Number(x.order))?Number(x.order):i+1,content:String(x.content||''),deletedAt:deletedAtOf(x.deletedAt)};}
  function normalizeLocalizedEvent(v){if(!v||typeof v!=='object')return null;const en=String(v.en||'').trim(),ko=String(v.ko||'').trim();return en&&ko?{en,ko}:null;}
  function normalizeTimelineItem(x={},i=0){const ages=Array.isArray(x.ages)?x.ages.map(a=>({label:String(a?.label||'').trim(),value:String(a?.value??'').trim()})).filter(a=>a.label&&a.value!==''):[];return {id:String(x.id||`timeline-${i+1}`),year:String(x.year||'').trim(),sortYear:Number(x.sortYear)||0,ages,primaryEvents:Array.isArray(x.primaryEvents)?x.primaryEvents.map(normalizeLocalizedEvent).filter(Boolean):[],secondaryEvents:Array.isArray(x.secondaryEvents)?x.secondaryEvents.map(normalizeLocalizedEvent).filter(Boolean):[],deletedAt:deletedAtOf(x.deletedAt)};}
  function normalizeMicroPost(p={}){const id=String(p.id||crypto.randomUUID());return {id,content:String(p.content||''),createdAt:normalizeDate(p.createdAt),threadId:String(p.threadId||id),parentId:p.parentId?String(p.parentId):null,deletedAt:deletedAtOf(p.deletedAt),archivedAt:p.archivedAt?normalizeDate(p.archivedAt):''};}
  function emptyState(){return {notes:[],scripts:[],timeline:[],microblogPosts:[],records:starter.records.map(normalizeRecord),pool:starter.pool.map(normalizePool)};}
  function load(){try{const raw=localStorage.getItem(KEY);if(!raw){const s=emptyState();localStorage.setItem(KEY,JSON.stringify(s));return s;}const p=JSON.parse(raw);return {notes:Array.isArray(p.notes)?p.notes.map(normalizeNote):[],scripts:Array.isArray(p.scripts)?p.scripts.map(normalizeScriptItem):[],timeline:Array.isArray(p.timeline)?p.timeline.map(normalizeTimelineItem):[],microblogPosts:Array.isArray(p.microblogPosts)?p.microblogPosts.map(normalizeMicroPost):[],records:Array.isArray(p.records)?p.records.map(normalizeRecord):[],pool:Array.isArray(p.pool)?p.pool.map(normalizePool):[]};}catch(e){console.error(e);return emptyState();}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){console.error(e);toast('이 기기의 저장 공간이 부족합니다.');return false}}
  function loadJSON(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}}
  function saveNoteDraft(){if(!$('#noteEditor').classList.contains('open'))return;noteDraft={noteId:editingNoteId||null,content:$('#noteText').value,category:$('#noteCategory').value,updatedAt:new Date().toISOString()};localStorage.setItem(NOTE_DRAFT_KEY,JSON.stringify(noteDraft));}
  function clearNoteDraft(){noteDraft=null;localStorage.removeItem(NOTE_DRAFT_KEY)}
  function saveMicroDraft(){microDraft={threadId:composingThreadId||null,content:$('#microText').value,updatedAt:new Date().toISOString()};localStorage.setItem(MICRO_DRAFT_KEY,JSON.stringify(microDraft));}
  function clearMicroDraft(){microDraft=null;localStorage.removeItem(MICRO_DRAFT_KEY)}
  function logEvent(type){try{const rows=loadJSON(EVENT_KEY,[]);rows.push({type,at:new Date().toISOString()});localStorage.setItem(EVENT_KEY,JSON.stringify(rows.slice(-500)))}catch{}}

  let state=load();
  let currentView='feed',editingRecordId=null,editingNoteId=null,editingPoolId=null,currentScriptId=null,composingThreadId=null;
  let activeNoteCategory='전체',noteSort=localStorage.getItem(NOTE_SORT_KEY)||'updatedDesc',timelineLang=localStorage.getItem(TIMELINE_LANG_KEY)||'ko';
  let noteCategoryOrder=loadJSON(NOTE_CATEGORY_ORDER_KEY,[]),noteDraft=loadJSON(NOTE_DRAFT_KEY,null),microDraft=loadJSON(MICRO_DRAFT_KEY,null);
  let feedOrder=[],feedCursor=0,feedObserver=null,archiveVisibleCount=ARCHIVE_BATCH,poolPickId=null;

  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const dateValue=v=>{const n=Date.parse(v);return Number.isFinite(n)?n:0};
  const fmt=v=>new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(dateValue(v)));
  const fmtDateTime=v=>new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(dateValue(v)));
  function toDateTimeLocal(v){const d=new Date(dateValue(v));if(!Number.isFinite(d.getTime()))return'';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
  function localDateKey(v){const d=new Date(dateValue(v));if(!Number.isFinite(d.getTime()))return'';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
  function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  const tagsFromInput=v=>[...new Set(String(v).split(',').map(x=>x.trim()).filter(Boolean))];
  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1700)}
  const activeRecords=()=>state.records.filter(x=>!x.deletedAt),activeNotes=()=>state.notes.filter(x=>!x.deletedAt),activePool=()=>state.pool.filter(x=>!x.deletedAt),activeScripts=()=>state.scripts.filter(x=>!x.deletedAt),activeTimeline=()=>state.timeline.filter(x=>!x.deletedAt);

  const VIEW_PARENT={write:'feed',archive:'more',timeline:'more',scripts:'more','script-detail':'scripts',links:'more',library:'more'};
  const VIEW_TITLE={feed:'피드',write:'새 글',notes:'노트',pool:'할 거리',more:'더보기',archive:'보관함',timeline:'연표',scripts:'스크립트','script-detail':'스크립트',links:'링크',library:'자료실'};
  function updateChrome(){let title=VIEW_TITLE[currentView]||'';if(currentView==='write')title=composingThreadId?'이어쓰기':'새 글';if(currentView==='script-detail'&&currentScriptId){const s=state.scripts.find(x=>x.id===currentScriptId);if(s)title=s.title}$('#pageTitle').textContent=title;$('#backTop').classList.toggle('hidden',!VIEW_PARENT[currentView]);$('#shuffleTop').classList.toggle('is-hidden',currentView!=='feed');$('#fab').classList.toggle('is-hidden',!['feed','notes','pool'].includes(currentView));$('#fab').setAttribute('aria-label',currentView==='feed'?'새 글':currentView==='notes'?'새 노트':'할 거리 추가');}
  function setView(name){currentView=name;$$('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${name}`));const nav=['archive','library','timeline','scripts','script-detail','links'].includes(name)?'more':name;$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===nav));if(name==='archive'){archiveVisibleCount=ARCHIVE_BATCH;renderArchive()}if(name==='notes')renderNotes();if(name==='pool')renderPool();if(name==='timeline')renderTimeline();if(name==='scripts')renderScripts();updateChrome();window.scrollTo({top:0,behavior:'instant'});logEvent('view_'+name)}

  function expandRow(kind,length=0){return `<button class="card-expand-row ${kind}-expand" type="button" aria-expanded="false"><span class="expand-label">더 보기</span><span class="expand-side">${kind==='archive'?`<span class="archive-char-count">${length.toLocaleString()}자</span>`:''}<span class="expand-chevron">⌄</span></span></button>`;}
  function recordCard(r,feed=false){const length=String(r.content||'').length,isLong=feed?length>FEED_COLLAPSE_THRESHOLD:length>ARCHIVE_COLLAPSE_THRESHOLD;const meta=feed?`<span>${fmt(r.createdAt)}</span>`:`${r.priority?`<span class="pill">${esc(r.priority)}</span>`:''}<span>${fmt(r.createdAt)}</span>`;const actions=feed?'<button class="feed-copy" type="button" aria-label="전체복사">⧉</button>':'<div class="card-top-actions"><button class="card-top-action archive-copy" type="button" aria-label="전체복사">⧉</button><button class="card-top-action archive-edit" type="button" aria-label="전체 편집">✎</button></div>';return `<article class="card ${feed?'feed-card':'archive-card'}" data-record-id="${esc(r.id)}">${actions}<div class="card-meta">${meta}</div><div class="card-text ${isLong?(feed?'feed-text collapsed':'archive-text collapsed'):''}">${esc(r.content)}</div>${isLong?expandRow(feed?'feed':'archive',length):''}${!feed&&r.tags?.length?`<div class="card-tags">${r.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>`:''}</article>`;}
  function setExpandState(btn,body,collapsed){body.classList.toggle('collapsed',collapsed);btn.setAttribute('aria-expanded',String(!collapsed));btn.querySelector('.expand-label').textContent=collapsed?'더 보기':'접기';btn.querySelector('.archive-char-count')?.classList.toggle('hidden',!collapsed)}
  function bindRecordCards(root){root.querySelectorAll('[data-record-id]').forEach(card=>{const id=card.dataset.recordId;card.querySelector('.feed-copy,.archive-copy')?.addEventListener('click',async e=>{e.stopPropagation();const r=state.records.find(x=>x.id===id);if(!r)return;try{await navigator.clipboard.writeText(r.content);toast('복사했습니다.')}catch{toast('복사하지 못했습니다.')}});card.querySelector('.archive-edit')?.addEventListener('click',e=>{e.stopPropagation();openRecordFull(id)});card.querySelector('.card-expand-row')?.addEventListener('click',e=>{e.stopPropagation();const body=card.querySelector('.card-text');setExpandState(e.currentTarget,body,!body.classList.contains('collapsed'))});if(card.classList.contains('archive-card'))card.addEventListener('click',()=>openRecordQuick(id));});}

  function microThreads(){const groups=new Map();state.microblogPosts.filter(p=>!p.deletedAt).forEach(p=>{if(!groups.has(p.threadId))groups.set(p.threadId,[]);groups.get(p.threadId).push(p)});return [...groups.entries()].map(([id,posts])=>{posts.sort((a,b)=>dateValue(a.createdAt)-dateValue(b.createdAt));return {id,posts,lastAt:Math.max(...posts.map(p=>dateValue(p.createdAt)))}})}

  function exportData(){downloadJSON({schemaVersion:6,kind:'app-backup',noteCategoryOrder,notes:state.notes,records:state.records,pool:state.pool,microblogPosts:state.microblogPosts,scripts:state.scripts,timeline:state.timeline},`archive-backup-${new Date().toISOString().slice(0,10)}.json`)}

  function clearMicroblog(){if(!confirm('마이크로블로그를 비울까요? 데이터는 실제 제거되지 않고 삭제 상태로 남습니다.'))return;const ts=new Date().toISOString();state.microblogPosts.forEach(p=>{if(!p.deletedAt)p.deletedAt=ts});clearMicroDraft();if(!save())return;feedOrder=buildFeedOrder();resetFeed(false);toast('비웠습니다.')}
  function clearAllSoft(){if(!confirm('이 기기의 모든 데이터를 지울까요? 데이터는 실제 제거되지 않고 삭제 상태로 남습니다.'))return;const ts=new Date().toISOString();['notes','records','pool','microblogPosts','scripts','timeline'].forEach(key=>state[key].forEach(x=>{if(!x.deletedAt)x.deletedAt=ts}));clearNoteDraft();clearMicroDraft();if(!save())return;feedOrder=[];resetFeed(false);renderArchive();renderNotes();renderPool();renderTimeline();renderScripts();closeModal('settingsModal');toast('모두 삭제 상태로 전환했습니다.')}
  function normalizeImportedPayload(parsed){if(!parsed||typeof parsed!=='object')throw new Error('JSON 최상위 구조가 올바르지 않습니다.');if(parsed.kind==='script-items'&&Array.isArray(parsed.items))return{type:'scripts',items:parsed.items.map(normalizeScriptItem).filter(x=>x.title&&x.content)};if(parsed.kind==='timeline-items'&&Array.isArray(parsed.items))return{type:'timeline',items:parsed.items.map(normalizeTimelineItem).filter(x=>x.year)};if(parsed.kind==='note-items'&&Array.isArray(parsed.items))return{type:'notes',items:parsed.items.map(normalizeNote).filter(x=>x.content.trim())};if(parsed.kind==='microblog-posts'&&Array.isArray(parsed.posts))return{type:'microblogPosts',items:parsed.posts.map(normalizeMicroPost).filter(x=>x.content.trim())};if(parsed.kind==='todo-items'&&Array.isArray(parsed.items))return{type:'pool',items:parsed.items.map(normalizePool).filter(x=>x.title.trim())};if(parsed.kind==='archive-records'&&Array.isArray(parsed.records))return{type:'records',items:parsed.records.map(normalizeRecord).filter(x=>x.content.trim())};if(parsed.kind==='app-backup'&&['records','notes','scripts','timeline','microblogPosts','pool'].every(k=>Array.isArray(parsed[k])))return{type:'backup',payload:parsed};throw new Error(`지원하지 않는 현재 형식입니다${parsed.kind?` (kind: ${parsed.kind})`:''}.`)}
  async function importData(file){let parsed,n;try{parsed=JSON.parse((await file.text()).replace(/^\uFEFF/,''));n=normalizeImportedPayload(parsed)}catch(e){console.error(e);toast('JSON 가져오기 형식을 확인해주세요.');$('#importFile').value='';return}try{if(n.type==='backup'){if(!confirm('현재 로컬 데이터를 이 백업으로 교체할까요?'))return;const p=n.payload;state={notes:p.notes.map(normalizeNote),records:p.records.map(normalizeRecord),pool:p.pool.map(normalizePool),microblogPosts:p.microblogPosts.map(normalizeMicroPost),scripts:p.scripts.map(normalizeScriptItem),timeline:p.timeline.map(normalizeTimelineItem)};if(Array.isArray(p.noteCategoryOrder)){noteCategoryOrder=p.noteCategoryOrder.map(String);localStorage.setItem(NOTE_CATEGORY_ORDER_KEY,JSON.stringify(noteCategoryOrder))}}else{const label={notes:'노트',records:'보관함 기록',pool:'할 거리',microblogPosts:'마이크로블로그',scripts:'스크립트',timeline:'연표'}[n.type];if(!confirm(`${label}를 가져온 ${n.items.length}개 항목으로 교체할까요?\n다른 데이터는 그대로 유지됩니다.`))return;state[n.type]=n.items}if(!save())return;syncCategoryOrder();feedOrder=buildFeedOrder();resetFeed(false);renderArchive();renderNotes();renderPool();renderTimeline();renderScripts();closeModal('settingsModal');toast('가져왔습니다.')}finally{$('#importFile').value=''}}
  function closeModal(id){$('#'+id).classList.remove('open')}

  $$('.nav-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));$$('[data-open-view]').forEach(b=>b.onclick=()=>setView(b.dataset.openView));
  $('#backTop').onclick=()=>setView(VIEW_PARENT[currentView]||'feed');$('#fab').onclick=()=>currentView==='feed'?openMicroComposer():currentView==='notes'?openNote():openPool();$('#shuffleTop').onclick=reshuffleFeed;
  $('#publishMicro').onclick=publishMicro;$('#microText').addEventListener('input',saveMicroDraft);
  $('#archiveFilterToggle').onclick=()=>{const open=!$('#archiveFilterPanel').classList.contains('open');$('#archiveFilterPanel').classList.toggle('open',open);$('#archiveFilterToggle').setAttribute('aria-expanded',String(open))};$('#searchInput').addEventListener('input',()=>{archiveVisibleCount=ARCHIVE_BATCH;renderArchive()});['archiveStart','archiveEnd','archiveTag','archivePriority','archiveSort'].forEach(id=>$('#'+id).addEventListener('input',()=>{archiveVisibleCount=ARCHIVE_BATCH;renderArchive()}));$('#saveRecordQuick').onclick=saveRecordQuick;$('#saveRecordEdit').onclick=saveRecordEdit;$('#deleteRecord').onclick=deleteRecord;
  $('#noteCategorySelect').addEventListener('change',e=>{activeNoteCategory=e.target.value;renderNotes()});$('#noteToolsToggle').onclick=()=>{const open=!$('#noteToolsPanel').classList.contains('open');$('#noteToolsPanel').classList.toggle('open',open);$('#noteToolsToggle').setAttribute('aria-expanded',String(open))};$('#noteSearchInput').addEventListener('input',renderNotes);$('#noteSort').addEventListener('change',e=>{noteSort=e.target.value;localStorage.setItem(NOTE_SORT_KEY,noteSort);renderNotes()});$('#manageNoteCategories').onclick=openCategoryManager;$('#renameCategoryBtn').onclick=renameCategory;$('#noteText').addEventListener('input',()=>{saveNoteDraft();updateNoteCharCount();autoGrowNote()});$('#noteCategory').addEventListener('input',saveNoteDraft);$('#closeNoteEditor').onclick=commitNoteAndClose;$('#copyNote').onclick=copyCurrentNote;$('#deleteNote').onclick=deleteNote;
  $('#addPoolBtn').onclick=()=>openPool();$('#savePool').onclick=savePool;$('#deletePool').onclick=deletePool;
  $('#timelineKo').onclick=()=>setTimelineLang('ko');$('#timelineEn').onclick=()=>setTimelineLang('en');
  $('#settingsBtn').onclick=()=>{$('#appVersion').textContent=`Prototype ${APP_VERSION}`;$('#settingsModal').classList.add('open')};$('#exportBtn').onclick=exportData;$('#exportMicroBtn').onclick=exportMicroblog;$('#clearMicroBtn').onclick=clearMicroblog;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>e.target.files[0]&&importData(e.target.files[0]);$('#reloadLatestBtn').onclick=()=>{const url=new URL(location.href);url.searchParams.set('_v',Date.now());location.replace(url)};$('#seedBtn').onclick=()=>{if(!confirm('현재 데이터에 샘플을 추가할까요?'))return;state.records.push(...starter.records.map(normalizeRecord));state.pool.push(...starter.pool.map(normalizePool));save();feedOrder=buildFeedOrder();resetFeed(false);renderArchive();renderPool();toast('샘플을 추가했습니다.')};$('#clearBtn').onclick=clearAllSoft;
  $$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));$$('.modal-backdrop').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));

  syncCategoryOrder();feedOrder=buildFeedOrder();resetFeed(false);renderArchive();renderNotes();renderPool();renderTimeline();renderScripts();updateChrome();logEvent('app_open');
})();
</script>
