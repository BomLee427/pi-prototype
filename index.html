<body>
<div class="app">

      <div class="statline" id="archiveStats"></div><div style="height:10px"></div><div id="archiveList"></div>
    </section>

    <section class="view" id="view-scripts"><div class="view-pad"></div><div class="script-list" id="scriptList"></div></section>

  </main>

  <button class="fab-secondary" id="shuffleFloat" aria-label="피드 새로고침"><i data-lucide="refresh-cw"></i></button>

<script>
(() => {
  const KEY='archive-prototype-v2';

    {id:'purple',bg:'#EFE5F5',fg:'#77508F'},{id:'pink',bg:'#F7E4EE',fg:'#95506F'},{id:'gray',bg:'#ECECEC',fg:'#5F5F5F'}

  const icon=(name,small=false)=>`<i data-lucide="${name}"${small?' class="icon-18"':''}></i>`;
  const starter={notes:[],scripts:[],timeline:[],microblogPosts:[],records:[

  function normalizeDate(v){if(typeof v==='string'&&v.trim())return v.trim();if(typeof v==='number')return new Date(v).toISOString();return new Date().toISOString();}

  $('#noteCategorySelect').addEventListener('change',e=>{activeNoteCategory=e.target.value;renderNotes()});$('#noteToolsToggle').onclick=()=>{const open=!$('#noteToolsPanel').classList.contains('open');$('#noteToolsPanel').classList.toggle('open',open);$('#noteToolsToggle').setAttribute('aria-expanded',String(open))};$('#noteSearchInput').addEventListener('input',renderNotes);$('#noteSort').addEventListener('change',e=>{noteSort=e.target.value;localStorage.setItem(NOTE_SORT_KEY,noteSort);renderNotes()});$('#manageNoteCategories').onclick=openCategoryManager;$('#renameCategoryBtn').onclick=renameCategory;$('#noteText').addEventListener('input',()=>{saveNoteDraft();updateNoteCharCount();autoGrowNote()});$('#noteCategory').addEventListener('change',()=>{applyNoteEditorCategoryColor($('#noteCategory').value);saveNoteDraft()});$('#noteMore').onclick=()=>{$('#noteActionsModal').classList.add('open');updateNoteStateButtons();refreshIcons()};$('#pinNote').onclick=()=>{editingNotePinned=!editingNotePinned;if(editingNotePinned)editingNoteArchived=false;updateNoteStateButtons();saveNoteDraft();closeModal('noteActionsModal')};$('#hideNote').onclick=()=>{editingNoteHidden=!editingNoteHidden;updateNoteStateButtons();saveNoteDraft();closeModal('noteActionsModal')};$('#archiveNote').onclick=()=>{editingNoteArchived=!editingNoteArchived;if(editingNoteArchived)editingNotePinned=false;updateNoteStateButtons();saveNoteDraft();closeModal('noteActionsModal')};$('#closeNoteEditor').onclick=commitNoteAndClose;$('#copyNote').onclick=async()=>{await copyCurrentNote();closeModal('noteActionsModal')};$('#deleteNote').onclick=()=>{closeModal('noteActionsModal');deleteNote()};

  $$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));$$('.modal-backdrop').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));

  syncCategoryOrder();feedOrder=buildFeedOrder();resetFeed(false);renderArchive();renderNotes();renderPool();renderTimeline();renderScripts();updateChrome();refreshIcons();logEvent('app_open');
